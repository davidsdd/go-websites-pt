<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <style>
    :root {
      color-scheme: light dark;
      --edge: #617895;
      --panel: #152d4d;
      --star: #eef3f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --edge: #9baec8;
        --panel: #132a49;
        --star: #e0e9f5;
      }
    }
  </style>
  <!-- 轴对称的闭合盾牌，内部保持统一深蓝底色。 -->
  <path d="M60 12L104 28V59C104 88 87 111 60 128C33 111 16 88 16 59V28L60 12Z" fill="var(--panel)" stroke="var(--edge)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 克制的四芒星，象征始终警觉、方向坚定的守护。 -->
  <path d="M60 43L65 60L80 65L65 70L60 87L55 70L40 65L55 60L60 43Z" fill="var(--star)"/>
</svg>
